# Settings in the [build] context are global and are applied to all contexts
# unless otherwise overridden by more specific contexts.
[build]
# Directory to change to before starting a build.
base = "site/"

# Directory that contains the deploy-ready HTML files, relative to base.
publish = "public"

# Default build command. --panicOnWarning fails the build on raw HTML in
# content and on any other Hugo warning.
command = "hugo --minify --panicOnWarning"


[build.environment]
# CI reads this value too (.github/workflows/build-website.yml), so Netlify
# and CI build with the same Hugo.
HUGO_VERSION = "0.154.5"

# Production context: all deploys from the Production branch set in your site's
# deploy contexts will inherit these settings.
[context.main.environment]
REPO_URL="https://github.com/ossf/scorecard-webapp"

# GoatCounter loads only on the production site.
[context.production.environment]
HUGO_PARAMS_ANALYTICS_GOATCOUNTER_CODE = "securityscorecards"

# Branch deploys (staging-00) and deploy previews are not indexed.
[context.branch-deploy.environment]
HUGO_CASCADE_PARAMS_NOINDEX = "true"

[context.deploy-preview.environment]
HUGO_CASCADE_PARAMS_NOINDEX = "true"
